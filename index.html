<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script>
  // ←←←←←←←←←←←←←← 把你的密钥粘贴在这里 ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓
  const firebaseConfig = {
    apiKey: "AIzaSyALoOzZu6uPdEuZvbw9PMq3Vxljb8ddL-A",   // ← 你的 apiKey
    authDomain: "lal-001-31ca4.firebaseapp.com",     // ← 你的 authDomain
    projectId: "lal-001-31ca4",                      // ← 你的 projectId
    storagebucket: "lal-001-31ca4.firebasestorage.app",     // ← 你的 storageBucket
    messagingSenderId: "779055965092",                 // ← 你的 messagingSenderId
    appId: "1:779055965092:web:f334511adc3b6c0ae29731"       // ← 你的 appId
  };
  // ↑↑↑↑↑↑↑↑↑↑↑↑↑↑ 到这里结束 ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  let sentenceList = [];
  let openStates = [];
  const DATA_DOC = "serbian-learning-data"; // 所有人共享同一个文档

  // 从云端加载数据
  async function loadData() {
    try {
      const doc = await db.collection("data").doc(DATA_DOC).get();
      if (doc.exists) {
        const data = doc.data();
        sentenceList = data.sentences || [];
        openStates = data.openStates || [];
      }
      render();
    } catch (e) {
      alert("加载云端数据失败，检查网络或密钥");
      console.error(e);
    }
  }

  // 保存到云端
  async function saveData() {
    try {
      await db.collection("data").doc(DATA_DOC).set({
        sentences: sentenceList,
        openStates: openStates
      });
    } catch (e) {
      alert("保存失败：" + e.message);
    }
  }

  // 上传音频到 Firebase Storage，返回永久链接
  async function uploadAudio(file) {
    if (!file) return "";
    const ref = storage.ref().child("audio/" + Date.now() + "_" + file.name);
    await ref.put(file);
    return await ref.getDownloadURL();
  }

  // 下面所有函数都改成云端版（功能和原来一模一样）
  async function addSentence() {
    sentenceList.push({ chinese: '', serbian: '', audioUrl: '', words: [] });
    openStates.push(true);
    render();
    await saveData();
  }

  async function deleteSentence(i) {
    if (confirm("确定删除这个句子组？")) {
      sentenceList.splice(i, 1);
      openStates.splice(i, 1);
      render();
      await saveData();
    }
  }

  async function updateSentence(i, field, value) {
    sentenceList[i][field] = value;
    render();
    await saveData();
  }

  async function toggleContent(i) {
    openStates[i] = !openStates[i];
    render();
    await saveData();
  }

  async function decomposeWords(i) {
    const serbian = sentenceList[i].serbian.trim();
    if (!serbian) return alert("请先填写塞尔维亚语句子！");
    const words = serbian.split(/[\s,.;!?]+/).filter(w => w);
    sentenceList[i].words = words.map(w => ({ chinese: '', serbian: w, audioUrl: '' }));
    render();
    await saveData();
  }

  async function addWord(i) {
    sentenceList[i].words.push({ chinese: '', serbian: '', audioUrl: '' });
    render();
    await saveData();
  }

  async function updateWord(i, j, field, value) {
    sentenceList[i].words[j][field] = value;
    render();
    await saveData();
  }

  async function deleteWord(i, j) {
    sentenceList[i].words.splice(j, 1);
    render();
    await saveData();
  }

  async function uploadSentenceAudio(i, file) {
    const url = await uploadAudio(file);
    if (url) {
      sentenceList[i].audioUrl = url;
      render();
      await saveData();
    }
  }

  async function uploadWordAudio(i, j, file) {
    const url = await uploadAudio(file);
    if (url) {
      sentenceList[i].words[j].audioUrl = url;
      render();
      await saveData();
    }
  }

  function playSentenceAudio(i) {
    const audio = document.querySelector(`#content-${i} audio`);
    audio && audio.play();
  }

  function playWordAudio(i, j) {
    const audio = document.querySelector(`#words-${i} .word-group:nth-child(${j+1}) audio`);
    audio && audio.play();
  }

  function render() {
    const container = document.getElementById('sentenceContainer');
    container.innerHTML = '';
    sentenceList.forEach((sentence, i) => {
      const isOpen = openStates[i] || false;
      const group = document.createElement('div');
      group.className = 'sentence-group';
      group.innerHTML = `
        <div class="sentence-header" onclick="toggleContent(${i})">
          句子 ${i+1}: ${sentence.chinese || '未填'} | ${sentence.serbian || '未填'}
          <button class="delete" onclick="deleteSentence(${i});event.stopPropagation()">删除组</button>
        </div>
        <div class="sentence-content" id="content-${i}" style="display:${isOpen?'block':'none'}">
          <div class="input-group">
            <label>中文句子</label>
            <input type="text" value="${sentence.chinese || ''}" onchange="updateSentence(${i},'chinese',this.value)">
          </div>
          <div class="input-group">
            <label>塞尔维亚语句子</label>
            <input type="text" value="${sentence.serbian || ''}" onchange="updateSentence(${i},'serbian',this.value)">
          </div>
          <div class="input-group">
            <label>句子音频</label>
            <input type="file" accept="audio/*" onchange="uploadSentenceAudio(${i},this.files[0])">
            ${sentence.audioUrl ? `<audio controls src="${sentence.audioUrl}"></audio>` : ''}
          </div>
          <button onclick="decomposeWords(${i})">分解单词</button>
          <button onclick="addWord(${i})">+ 添加单词</button>
          <div id="words-${i}">${renderWords(i)}</div>
        </div>
      `;
      container.appendChild(group);
    });
  }

  function renderWords(i) {
    return (sentenceList[i].words || []).map((w, j) => `
      <div class="word-group">
        <input type="text" value="${w.chinese || ''}" onchange="updateWord(${i},${j},'chinese',this.value)" placeholder="中文">
        <input type="text" value="${w.serbian || ''}" onchange="updateWord(${i},${j},'serbian',this.value)" placeholder="塞尔维亚语">
        <input type="file" accept="audio/*" onchange="uploadWordAudio(${i},${j},this.files[0])">
        ${w.audioUrl ? `<audio controls src="${w.audioUrl}"></audio>` : ''}
        <button class="delete" onclick="deleteWord(${i},${j})">删除</button>
      </div>
    `).join('');
  }

  // 页面加载就从云端拉数据
  loadData();
</script>
