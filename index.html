<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SerbBuilder: 塞尔维亚语学习库</title>
    <style>
        body {font-family: Arial, sans-serif;max-width: 900px;margin: 0 auto;padding: 20px;background: #f4f4f4;color: #333;}
        h1 {text-align: center;color: #2c3e50;}
        .tip {text-align: center;margin: 10px 0;font-size: 0.9em;color: #e74c3c;}
        .sentence-group {border: 1px solid #ddd;margin: 20px 0;padding: 0;border-radius: 8px;background: white;box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .sentence-header {background: #4CAF50;color: white;padding: 12px;cursor: pointer;border-radius: 8px 8px 0 0;display: flex;justify-content: space-between;align-items: center;}
        .sentence-header:hover {background: #45a049;}
        .sentence-content {padding: 15px;display: none;}
        .open .sentence-content {display: block;}
        .input-group {margin: 12px 0;}
        label {display: block;font-weight: bold;margin-bottom: 5px;color: #2c3e50;}
        input[type="text"], input[type="file"] {width: 100%;padding: 8px;border: 1px solid #ccc;border-radius: 4px;box-sizing: border-box;}
        button {background: #4CAF50;color: white;padding: 8px 16px;border: none;border-radius: 4px;cursor: pointer;margin: 5px 5px 5px 0;}
        button:hover {background: #45a049;}
        button.delete {background: #e74c3c;}
        button.delete:hover {background: #c0392b;}
        button.pause {background: #ff9800;}
        button.pause:hover {background: #e68900;}
        audio {width: 100%;margin-top: 8px;}
        #addSentence {text-align: center;margin: 30px 0;}
        .word-group {border: 1px dashed #bbb;margin: 15px 0;padding: 12px;border-radius: 6px;background: #fafafa;}
        .word-group h4 {margin: 0 0 10px 0;color: #2c3e50;}
    </style>
</head>
<body>
    <h1>SerbBuilder: 塞尔维亚语学习库</h1>
    <p class="tip">点击“添加新句子”开始。所有数据自动保存在浏览器本地，换电脑会丢失（后面可以教你换成云端永久保存）。</p>

    <div id="sentenceContainer"></div>

    <div id="addSentence">
        <button onclick="addSentence()">添加新句子</button>
    </div>

    <script>
        let sentenceList = JSON.parse(localStorage.getItem('sentenceList')) || [];
        let openStates = JSON.parse(localStorage.getItem('openStates')) || [];

        function saveData() {
            localStorage.setItem('sentenceList', JSON.stringify(sentenceList));
            localStorage.setItem('openStates', JSON.stringify(openStates));
        }

        function render() {
            const container = document.getElementById('sentenceContainer');
            container.innerHTML = '';
            sentenceList.forEach((sentence, i) => {
                const isOpen = openStates[i] || false;
                const group = document.createElement('div');
                group.className = 'sentence-group' + (isOpen ? ' open' : '');
                group.innerHTML = `
                    <div class="sentence-header" onclick="toggleContent(${i})">
                        <span>句子 ${i+1}: ${sentence.chinese || '未填中文'} | ${sentence.serbian || '未填塞尔维亚语'}</span>
                        <button class="delete" onclick="deleteSentence(${i}); event.stopPropagation();">删除整个句子</button>
                    </div>
                    <div class="sentence-content">
                        <div class="input-group">
                            <label>中文句子</label>
                            <input type="text" value="${sentence.chinese || ''}" onchange="updateSentence(${i}, 'chinese', this.value)">
                        </div>
                        <div class="input-group">
                            <label>塞尔维亚语句子</label>
                            <input type="text" value="${sentence.serbian || ''}" onchange="updateSentence(${i}, 'serbian', this.value)">
                        </div>
                        <div class="input-group">
                            <label>句子音频（可选）</label>
                            <input type="file" accept="audio/*" onchange="uploadSentenceAudio(${i}, this.files[0])">
                            ${sentence.audioUrl ? `<audio controls src="${sentence.audioUrl}"></audio><button onclick="playSentenceAudio(${i})">播放</button>` : ''}
                        </div>
                        <button onclick="addWord(${i})">＋ 添加单词</button>
                        <div id="words-${i}">${renderWords(i)}</div>
                    </div>
                `;
                container.appendChild(group);
            });
        }

        function addSentence() {
            sentenceList.push({ chinese: '', serbian: '', audioUrl: '', words: [] });
            openStates[sentenceList.length - 1] = true;
            saveData();
            render();
        }

        function deleteSentence(i) {
            if (confirm('确定删除这个句子组吗？')) {
                sentenceList.splice(i, 1);
                openStates.splice(i, 1);
                saveData();
                render();
            }
        }

        function toggleContent(i) {
            openStates[i] = !openStates[i];
            saveData();
            render();
        }

        function updateSentence(i, field, value) {
            sentenceList[i][field] = value;
            saveData();
            render();
        }

        function addWord(sentenceIndex) {
            sentenceList[sentenceIndex].words.push({ chinese: '', serbian: '', audioUrl: '' });
            saveData();
            render();
        }

        function renderWords(sentenceIndex) {
            return (sentenceList[sentenceIndex].words || []).map((word, j) => `
                <div class="word-group">
                    <div class="input-group">
                        <label>中文</label>
                        <input type="text" value="${word.chinese || ''}" onchange="updateWord(${sentenceIndex},${j},'chinese',this.value)">
                    </div>
                    <div class="input-group">
                        <label>塞尔维亚语</label>
                        <input type="text" value="${word.serbian || ''}" onchange="updateWord(${sentenceIndex},${j},'serbian',this.value)">
                    </div>
                    <div class="input-group">
                        <label>单词音频（可选）</label>
                        <input type="file" accept="audio/*" onchange="uploadWordAudio(${sentenceIndex},${j},this.files[0])">
                        ${word.audioUrl ? `<audio controls src="${word.audioUrl}"></audio><button onclick="playWordAudio(${sentenceIndex},${j})">播放</button>` : ''}
                    </div>
                    <button class="delete" onclick="deleteWord(${sentenceIndex},${j})">删除这个词</button>
                </div>
            `).join('');
        }

        function updateWord(i, j, field, value) {
            sentenceList[i].words[j][field] = value;
            saveData();
        }

        function deleteWord(i, j) {
            sentenceList[i].words.splice(j, 1);
            saveData();
            render();
        }

        function uploadSentenceAudio(i, file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                sentenceList[i].audioUrl = e.target.result;
                saveData();
                render();
            };
            reader.readAsDataURL(file);
        }

        function uploadWordAudio(i, j, file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                sentenceList[i].words[j].audioUrl = e.target.result;
                saveData();
                render();
            };
            reader.readAsDataURL(file);
        }

        function playSentenceAudio(i) {
            const audio = document.querySelectorAll('audio')[i];
            audio && audio.play();
        }

        function playWordAudio(i, j) {
            const audio = document.querySelector(`#words-${i} .word-group:nth-child(${j+1}) audio`);
            audio && audio.play();
        }

        // 页面加载立即渲染
        render();
    </script>
</body>
</html>
